<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" class="cute-bot-svg">
  <defs>
    <!-- Metallic Body Gradient -->
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#d6e0ec"/>
      <stop offset="100%" stop-color="#8fa3bb"/>
    </linearGradient>

    <!-- Dark Screen Visor Gradient -->
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0a121e"/>
      <stop offset="100%" stop-color="#03060a"/>
    </linearGradient>
  </defs>

  <!-- Side Ear / Audio Pods -->
  <rect x="6" y="38" width="8" height="24" rx="4" fill="#8fa3bb" />
  <rect x="86" y="38" width="8" height="24" rx="4" fill="#8fa3bb" />
  <circle cx="10" cy="50" r="4.5" fill="#00e5ff" opacity="0.35" />
  <circle cx="10" cy="50" r="2.5" fill="#00e5ff" />
  <circle cx="90" cy="50" r="4.5" fill="#00e5ff" opacity="0.35" />
  <circle cx="90" cy="50" r="2.5" fill="#00e5ff" />

  <!-- Robot Outer Head (White/Silver Rounded Chassis) -->
  <rect x="12" y="16" width="76" height="68" rx="28" fill="url(#bodyGrad)" stroke="#c2d3e5" stroke-width="2"/>

  <!-- Top Head Notch Accent -->
  <path d="M 40 17 L 60 17 L 56 22 L 44 22 Z" fill="#7a90a8" opacity="0.6"/>

  <!-- Glass Visor Face Screen -->
  <rect x="20" y="24" width="60" height="52" rx="20" fill="url(#screenGrad)" stroke="#1a2e47" stroke-width="2"/>

  <!-- Glowing Cyan Curved Left Eye (soft halo via wider translucent stroke behind) -->
  <path d="M 32 46 Q 39 37 46 46" fill="none" stroke="#00e5ff" stroke-width="9" stroke-linecap="round" opacity="0.25"/>
  <path d="M 32 46 Q 39 37 46 46" fill="none" stroke="#00e5ff" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Glowing Cyan Curved Right Eye -->
  <path d="M 54 46 Q 61 37 68 46" fill="none" stroke="#00e5ff" stroke-width="9" stroke-linecap="round" opacity="0.25"/>
  <path d="M 54 46 Q 61 37 68 46" fill="none" stroke="#00e5ff" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Cute Glowing Smile -->
  <path d="M 44 58 Q 50 64 56 58" fill="none" stroke="#00e5ff" stroke-width="7" stroke-linecap="round" opacity="0.25"/>
  <path d="M 44 58 Q 50 64 56 58" fill="none" stroke="#00e5ff" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Screen Glass Reflection Glare -->
  <path d="M 26 30 Q 50 24 74 30" fill="none" stroke="#ffffff" stroke-width="1.8" opacity="0.15" stroke-linecap="round"/>
</svg>
